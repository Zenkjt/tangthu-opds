  .modal-backdrop{padding:6px}
  .modal{width:100%;max-width:100%;max-height:94vh}
  .modal-body{padding:8px}
  .story-info-panel{padding:8px;min-width:0}
  .story-info{min-height:0}
  .story-info-body{grid-template-columns:120px minmax(0,1fr);column-gap:10px;row-gap:8px;min-width:0}
  .story-cover{width:120px;height:180px;max-width:100%}
  .story-details{min-width:0;overflow:hidden}
  .story-details h2{font-size:20px;line-height:1.15;overflow-wrap:anywhere;word-break:break-word}
  .story-row{grid-template-columns:78px minmax(0,1fr);gap:5px;margin:6px 0;font-size:13px;align-items:start}
  .story-row span{min-width:0}
  .story-row b{min-width:0;overflow-wrap:anywhere;word-break:break-word}
  .story-message{grid-column:1/-1;margin-top:4px}
  .story-nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .story-nav button{min-width:0;width:100%;padding:5px 4px}
  .story-inputs fieldset{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px}
  .story-inputs input{min-width:0;width:100%}
  .story-inputs button{min-width:92px}
}

@media(max-width:360px){
  .story-info-body{grid-template-columns:1fr}
  .story-cover{width:120px;height:180px}
  .story-details h2{margin-top:2px}
}

.story-help-panel{margin:0 0 12px;padding:10px;border:1px solid #888;line-height:1.5;max-height:55vh;overflow:auto}
.story-help-panel p{margin:0 0 9px}
.story-help-panel p:last-child{margin-bottom:0}
.story-help-panel code{font-family:Consolas,monospace}
#storyHelpBtn{min-width:28px;height:24px;padding:0 7px;margin:0 4px 0 0;background:#c0c0c0;color:#000;border:2px solid #fff;border-right-color:#555;border-bottom-color:#555;font-weight:bold;cursor:pointer;flex:0 0 auto}
#storyHelpBtn:active{border-color:#555 #fff #fff #555;padding:1px 6px 0 8px}

/* CrossPoint plugin maker */
#storyCrosspointBtn{white-space:nowrap}
.tt-crosspoint-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:10000;padding:16px;box-sizing:border-box}
.tt-crosspoint-modal{width:min(520px,100%);background:#fff;border:1px solid #999;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:22px;box-sizing:border-box;color:#222}
.tt-crosspoint-modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.tt-crosspoint-modal h3{margin:0;font-size:20px}
.tt-crosspoint-close{flex:0 0 auto;width:34px;height:34px;padding:0;border:1px solid #aaa;border-radius:6px;background:#fff;font-size:23px;line-height:1;cursor:pointer}
.tt-crosspoint-modal p{margin:0 0 18px;color:#666}
.tt-crosspoint-modal label{display:block;font-weight:600;margin-bottom:7px}
.tt-crosspoint-modal input{width:100%;box-sizing:border-box;padding:12px;font-size:18px;border:1px solid #aaa;border-radius:6px}
.tt-crosspoint-actions{display:flex;gap:8px;justify-content:flex-start;margin-top:14px}
.tt-crosspoint-actions button{padding:11px 20px;font-size:16px;border:1px solid #888;border-radius:6px;background:#fff;cursor:pointer}
.tt-crosspoint-actions button:hover,.tt-crosspoint-close:hover{background:#f3f3f3}
#ttCrosspointCancel{margin-left:auto}
.tt-crosspoint-status{margin-top:12px;white-space:pre-line}
.tt-crosspoint-status.err{color:#a00}
@media(max-width:600px){
  .tt-crosspoint-backdrop{padding:8px}
  .tt-crosspoint-modal{padding:18px}
}
</style>

</head>
<body>
<div class="win">
  <div class="titlebar"><div class="appicon">📖</div><div class="caption">Tàng thư - by Zenkjt</div></div>
  <div class="toolbar">
    <button class="tool" id="upBtn"><span class="ico">📁</span><span class="lbl">Up</span></button>
    <button class="tool" id="homeBtn"><span class="ico">⌂</span><span class="lbl">Home</span></button>
    <button class="tool" id="refreshBtn"><span class="ico">⟳</span><span class="lbl">Refresh</span></button>
    <button class="tool" id="searchBtn"><span class="ico">🔎</span><span class="lbl">Search</span></button>
    <button class="tool" id="shelfBtn"><span class="ico">📚</span><span class="lbl">Tủ sách</span></button>
    <button class="tool" id="newsBtn"><span class="ico">📰</span><span class="lbl">Tin tức</span></button>
    <button class="tool" id="storyBtn"><span class="ico">📖</span><span class="lbl">Truyện online</span></button>
    <button class="tool" id="viewsBtn"><span class="ico">▤</span><span class="lbl">Views</span></button>
    <button class="tool" id="infoBtn"><span class="ico">ℹ</span><span class="lbl">Info</span></button>
    <div class="brand"><strong>Bookshelves</strong><em>A book is a dream holding in your hands.</em></div>
  </div>
  <div class="main">
    <section class="panel" id="shelfPanel">
      <div class="panel-title">TỦ SÁCH <span class="count" id="branchCount"></span></div>
      <div class="panel-body"><ul class="library-list" id="branchList"></ul></div>
      <div class="sidebar-foot" id="sidebarFoot">Đang tải...</div>
    </section>
    <section class="panel" id="contentPanel">
      <div class="panel-title">NỘI DUNG <span class="count" id="itemCount"></span></div>
      <div class="content-path" id="pathBar">Tàng Thư</div>
      <div class="panel-body" id="contentBody"></div>
    </section>
  </div>
  <div class="searchbar">
    <label for="searchInput">🔎 Tìm kiếm:</label>
    <input id="searchInput" type="search" placeholder="Nhập tên sách, tác giả, từ khóa..." autocomplete="off">
    <button id="searchDo">Tìm</button>
    <select id="searchScope" title="Phạm vi tìm kiếm"><option value="all">Tất cả tủ sách</option><option value="current">Tủ đang mở</option></select>
  </div>
  <div class="status"><span id="statusLeft">Sẵn sàng.</span><span>TÀNG THƯ | OPDS | 2026</span></div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-title"><span id="modalTitle">Thông tin</span><button class="close" id="modalClose">×</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<script>
(function(){
  'use strict';
  var state={catalog:null,branch:null,parent:null,view:'shelves',selected:null,search:''};
  var $=function(id){return document.getElementById(id)};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var size=function(n){n=Number(n)||0;if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';if(n<1073741824)return (n/1048576).toFixed(1)+' MB';return (n/1073741824).toFixed(2)+' GB'};
  var ext=function(n){var m=String(n||'').toLowerCase().match(/\.([^.]+)$/);return m?m[1].toUpperCase():'FILE'};
  var first=function(v){return v&&v.length?v[0]:''};
  var authors=function(m){return m&&m.authors?m.authors.join(', '):''};
  var modal=function(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalBackdrop').classList.add('open')};
  var closeModal=function(){$('modalBackdrop').classList.remove('open')};
  $('modalClose').onclick=closeModal;
  $('modalBackdrop').onclick=function(e){if(e.target===$('modalBackdrop'))closeModal()};

  function branches(){return state.catalog&&state.catalog.branches||[]}
  function currentBranch(){return branches().find(function(b){return b.id===state.branch})}
  function filesOf(b){return b&&b.files||[]}
  function children(b,parent){return filesOf(b).filter(function(f){return f.parent_id===parent}).sort(function(a,c){if(!!a.folder!==!!c.folder)return a.folder?-1:1;return a.name.localeCompare(c.name,'vi',{sensitivity:'base'})})}
  function findFile(b,id){return filesOf(b).find(function(f){return f.id===id})}
  function folderPath(b,id){var out=[];var guard=0;while(id&&id!==b.root_folder_id&&guard++<100){var f=findFile(b,id);if(!f)break;out.unshift(f.name);id=f.parent_id}return out}
  function displayDate(s){if(!s)return '';var d=new Date(s);return isNaN(d)?s:d.toLocaleString('vi-VN',{dateStyle:'short',timeStyle:'short'})}

  // Browser history for navigation inside Tàng Thư.
  function navState(){
    return {tangthu:true,branch:state.branch,parent:state.parent,search:state.search||''};
  }
  function pushNavState(){
    history.pushState(navState(),'');
  }
  function restoreNavState(s){
    if(!s||!s.tangthu)return false;
    state.branch=s.branch||null;
    var b=currentBranch();
    state.parent=b?(s.parent||b.root_folder_id):null;
    state.search=s.search||'';
    state.selected=null;
    $('searchInput').value=state.search;
    renderBranches();
    renderContent();
    return true;
  }
  window.addEventListener('popstate',function(e){
    if(!restoreNavState(e.state))return;
  });

  $('branchList').addEventListener('click',function(e){
    if(e.target.closest('li.branch'))pushNavState();
  });


  /* TANGTHU_SHELF_NO_V2 */
  function shelfLabel(b){
    var name=b && (b.name||b.display_name) || '';
    var no=b && Number(b.shelf_no);
    return no>0 ? name+' #'+no : name;
  }

  function renderBranches(){
    var list=$('branchList');list.innerHTML='';
    branches().forEach(function(b){
      var li=document.createElement('li');
      li.className='branch'+(state.branch===b.id?' active':'');
      li.style.position='relative';
      li.style.display='flex';
      li.style.alignItems='center';
      li.style.gap='5px';
      li.style.paddingRight='42px';
      li.style.boxSizing='border-box';

      var main=document.createElement('span');
      main.style.display='flex';
      main.style.alignItems='center';
      main.style.gap='7px';
      main.style.minWidth='0';
      main.style.flex='1 1 auto';
      main.style.overflow='hidden';
      main.innerHTML='<span class="folder-icon">📚</span><span class="branch-name">'+esc(shelfLabel(b))+'</span>';
      main.onclick=function(){
        state.view='list';
        $('viewsBtn').querySelector('.lbl').textContent='Views';
        state.branch=b.id;
        state.parent=b.root_folder_id;
        state.selected=null;
        renderBranches();
        renderContent();
      };

      var reload=document.createElement('button');
      reload.type='button';
      reload.title='Reload tủ này';
      reload.setAttribute('aria-label','Reload tủ '+b.name);
      reload.textContent='↻';
      reload.style.position='absolute';
      reload.style.right='8px';
      reload.style.top='50%';
      reload.style.transform='translateY(-50%)';
      reload.style.zIndex='5';
      reload.style.display='inline-flex';
      reload.style.alignItems='center';
      reload.style.justifyContent='center';
      reload.style.flex='0 0 28px';
      reload.style.width='28px';
      reload.style.minWidth='28px';
      reload.style.height='24px';
      reload.style.padding='0';
      reload.style.margin='0';
      reload.style.boxSizing='border-box';
      reload.style.background='#c0c0c0';
      reload.style.color='#000';
      reload.style.border='2px solid #fff';
      reload.style.borderRightColor='#555';
      reload.style.borderBottomColor='#555';
      reload.onclick=function(e){
        e.preventDefault();
        e.stopPropagation();
        reloadShelfFromGUI(b,reload);
      };

      li.appendChild(main);
      li.appendChild(reload);
      list.appendChild(li);
    });
    $('branchCount').textContent=branches().length+' tủ';
    $('sidebarFoot').textContent=branches().length+' tủ sách';
  }

  function shelfSnapshot(shelf){
    if(!shelf)return '';
    return JSON.stringify({id:shelf.id,name:shelf.name,root_folder_id:shelf.root_folder_id,files:shelf.files||[]});
  }

  function fetchFreshCatalog(){
    return fetch('catalog.json?__refresh='+Date.now(),{cache:'no-store'}).then(function(r){
      if(!r.ok)throw new Error('catalog '+r.status);
      return r.json();
    });
  }

  function waitForShelfUpdate(b,button,baseline,attempt){
    attempt=attempt||0;
    var maxAttempts=120;
    if(attempt>=maxAttempts){
      $('statusLeft').textContent='Đã gửi yêu cầu cập nhật tủ "'+b.name+'", nhưng chưa nhận được bản deploy mới. Có thể kiểm tra lại sau.';
      button.disabled=false;button.textContent='↻';return;
    }
    window.setTimeout(function(){
      fetchFreshCatalog().then(function(catalog){
        var updated=(catalog.branches||[]).find(function(x){return x.id===b.id});
        if(updated && shelfSnapshot(updated)!==baseline){
          state.catalog=catalog;
          renderBranches();
          renderContent();
          $('statusLeft').textContent='Tủ "'+b.name+'" đã cập nhật. Danh sách sách vừa được làm mới.';
          button.disabled=false;button.textContent='↻';return;
        }
        $('statusLeft').textContent='Đang build và deploy tủ "'+b.name+'"…';
        waitForShelfUpdate(b,button,baseline,attempt+1);
      }).catch(function(){waitForShelfUpdate(b,button,baseline,attempt+1);});
    },15000);
  }

  function reloadShelfFromGUI(b,button){
    var apiUrl='https://script.google.com/macros/s/AKfycbxkXzEVMXy2p6S0C6fMJKoLKDS_arBT0aRaq2x9X6w24L3Ea5RjmKPmxiOYhMUdMe_y5g/exec';
    if(!apiUrl){$('statusLeft').textContent='Apps Script chưa được cấu hình.';return;}
    if(button.disabled)return;
    var oldShelf=(state.catalog.branches||[]).find(function(x){return x.id===b.id});
    var baseline=shelfSnapshot(oldShelf);
    button.disabled=true;button.textContent='…';
    $('statusLeft').textContent='Đang kiểm tra tủ "'+b.name+'" trên Google Drive…';
    fetch(apiUrl,{
      method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'reload',branch_id:b.id})
    }).then(function(r){
      return r.text().then(function(t){
        var data={};
        try{data=JSON.parse(t||'{}')}catch(e){throw new Error('Apps Script trả về dữ liệu không hợp lệ.');}
        if(!r.ok)throw new Error('HTTP '+r.status);
        return data;
      });
    }).then(function(data){
      if(!data.ok)throw new Error(data.error||'Không thể reload tủ.');
      if(data.changed || data.queued){
        $('statusLeft').textContent=data.queued
          ? 'Tủ "'+b.name+'" đang được scan; sẽ tự cập nhật khi hoàn tất…'
          : 'Đã phát hiện thay đổi ở tủ "'+b.name+'". Đang build và deploy…';
        waitForShelfUpdate(b,button,baseline,0);return;
      }
      $('statusLeft').textContent='Tủ "'+b.name+'" đã được kiểm tra: không có thay đổi.';
      button.disabled=false;button.textContent='↻';
    }).catch(function(err){
      $('statusLeft').textContent='Reload lỗi: '+String(err);
      button.disabled=false;button.textContent='↻';
    });
  }

  var shelfResizeObserver=null;
  function renderShelfStats(){
    var body=$('contentBody');
    body.innerHTML='';
    $('pathBar').textContent='Tất cả tủ sách';
    var bs=branches();
    $('itemCount').textContent=bs.length+' tủ';
    if(!bs.length){body.innerHTML='<div class="empty">Chưa có tủ sách.</div>';return}

    if(shelfResizeObserver){shelfResizeObserver.disconnect();shelfResizeObserver=null;}
    var main=document.querySelector('.main');
    if(main)main.classList.add('shelf-only');

    var view=document.createElement('div');
    view.className='shelf-view';
    var iconNames=['book-blue.png','book-brown.png','book-green.png','book-purple.png','book-red.png','book-teal.png'];

    function shelfFiles(shelf){return filesOf(shelf).filter(function(f){return !f.folder;});}
    function extension(name){var p=String(name||'').lastIndexOf('.');return p<0?'':String(name).slice(p+1).toUpperCase();}
    function statsLines(shelf){
      var files=shelfFiles(shelf), bookCount=0, fontCount=0, counts={};
      var bookFormats=['EPUB','MOBI','AZW3','CBZ','LIT','CHM','PRC','PDF','ZIP','DOC','DOCX','TXT','MD'];
      files.forEach(function(f){
        var e=extension(f.name);
        if(e==='CPFONT'||e==='TTF'||e==='OTF'){
          fontCount++;
          return;
        }
        if(bookFormats.indexOf(e)>=0){
          bookCount++;
          counts[e]=(counts[e]||0)+1;
        }
      });
      var lines=[];
      if(bookCount>0)lines.push(bookCount+' sách');
      bookFormats.forEach(function(format){
        var count=counts[format]||0;
        if(count>0)lines.push(format+' '+count);
      });
      if(fontCount>0)lines.push(fontCount+' font');
      return lines;
    }
    function stats(shelf){return statsLines(shelf).join(' · ');}
    function openShelf(shelf){
      state.view='list';
      state.branch=shelf.id;
      state.parent=shelf.root_folder_id;
      state.selected=null;
      $('viewsBtn').querySelector('.lbl').textContent='Views';
      var main=document.querySelector('.main');
      if(main)main.classList.remove('shelf-only');
      renderBranches();
      renderContent();
    }

    var row=document.createElement('div');
    row.className='shelf-row';
    var books=document.createElement('div');
    books.className='shelf-books';

    bs.forEach(function(shelf,index){
        var item=document.createElement('button');
        item.type='button';
        item.className='shelf-book';
        item.title=shelfLabel(shelf);
        item.setAttribute('aria-label',(shelfLabel(shelf))+' — '+stats(shelf));

        var cover=document.createElement('div');
        cover.className='shelf-book-cover';

        var img=document.createElement('img');
        img.src='assets/bookshelf/'+iconNames[index%iconNames.length];
        img.alt='';
        img.draggable=false;

        var name=document.createElement('div');
        name.className='shelf-book-name';
        name.textContent=shelfLabel(shelf);

        cover.appendChild(img);
        cover.appendChild(name);

        var meta=document.createElement('div');
        meta.className='shelf-book-stats';
        statsLines(shelf).forEach(function(line){
          var lineEl=document.createElement('span');
          lineEl.textContent=line;
          meta.appendChild(lineEl);
        });

        item.appendChild(cover);
        item.appendChild(meta);
        item.onclick=(function(s){return function(){openShelf(s);};})(shelf);
        books.appendChild(item);
    });

    row.appendChild(books);
    view.appendChild(row);
    body.appendChild(view);

    function resizeShelves(){
      row.querySelectorAll('.shelf-line').forEach(function(el){el.remove();});
      var items=Array.prototype.slice.call(books.querySelectorAll('.shelf-book'));
      if(!items.length)return;
      var groups=[];
      items.forEach(function(item){
        var top=item.offsetTop;
        var group=groups.length?groups[groups.length-1]:null;
        if(!group || Math.abs(group.top-top)>2){group={top:top,items:[]};groups.push(group);}
        group.items.push(item);
      });
      var rowRect=row.getBoundingClientRect();
      groups.forEach(function(group){
        var first=group.items[0].getBoundingClientRect();
        var last=group.items[group.items.length-1].getBoundingClientRect();
        var left=Math.max(0,first.left-rowRect.left-12);
        var right=Math.max(left,last.right-rowRect.left-12);
        var line=document.createElement('div');
        line.className='shelf-line';
        line.style.left=left+'px';
        line.style.width=(right-left)+'px';
        line.style.top=(group.top+group.items[0].offsetHeight+8)+'px';
        row.appendChild(line);
      });
    }
    resizeShelves();
    if(window.ResizeObserver){
      shelfResizeObserver=new ResizeObserver(function(){resizeShelves();});
      shelfResizeObserver.observe(books);
    }
  }

  function renderContent(){if(state.view==='shelves'){renderShelfStats();return;}if(shelfResizeObserver){shelfResizeObserver.disconnect();shelfResizeObserver=null;}var main=document.querySelector('.main');if(main)main.classList.remove('shelf-only');
    var b=currentBranch();var body=$('contentBody');body.innerHTML='';
    if(!b){$('pathBar').textContent='Tàng Thư';$('itemCount').textContent='';body.innerHTML='<div class="empty">Chưa có tủ sách. Hãy dùng nút <strong>Tủ sách</strong> để tạo tủ mới.</div>';return}
    var path=[shelfLabel(b)].concat(folderPath(b,state.parent));$('pathBar').textContent=path.join('  ›  ');
    var rows=children(b,state.parent);
    var q=state.search.trim().toLocaleLowerCase('vi-VN');
    if(q){rows=filesOf(b).filter(function(f){var m=f.metadata||{};var a=authors(m);return !f.folder&&(f.name+' '+(f.mime||'')+' '+a+' '+(m.title||'')+' '+(m.publisher||'')+' '+(m.series||'')).toLocaleLowerCase('vi-VN').indexOf(q)>=0})}
    $('itemCount').textContent=rows.length+(q?' kết quả':' mục');
    if(!rows.length){body.innerHTML='<div class="empty">'+(q?'Không tìm thấy sách phù hợp.':'Thư mục này chưa có nội dung.')+'</div>';return}
    var table=document.createElement('table');table.className='books';
    table.innerHTML='<thead><tr><th style="width:44px"> </th><th>Tên sách</th><th style="width:190px">Tác giả</th><th style="width:90px">Định dạng</th><th style="width:105px">Dung lượng</th><th style="width:85px">Ngày</th></tr></thead>';
    var tb=document.createElement('tbody');
    rows.forEach(function(f){
      var tr=document.createElement('tr');tr.className=(f.folder?'folder-row ':'book-row ')+(state.selected===f.id?'selected':'');

  function parseDriveId(s){
    var text=String(s||'').trim();
    var m=text.match(/\/drive\/(?:u\/\d+\/)?folders\/([A-Za-z0-9_-]+)/);
    if(m)return m[1];
    m=text.match(/\/folders\/([A-Za-z0-9_-]+)/);
    if(m)return m[1];
    m=text.match(/[?&]id=([A-Za-z0-9_-]+)/);
    return m?m[1]:'';
  }

  function showNews(){
    var draft={branch:null,mode:'text',sources:[],selected:{},touched:{},pending:{}};
    var guard=function(e){
      var t=e.target;
      if(!t||!t.closest)return;
      var input=t.closest('#newsSourceUrl, #newsShelfUrl, #newsSources input');
      if(input&&(e.key==='Backspace'||e.key==='Delete'))e.stopImmediatePropagation();
    };
    window.addEventListener('keydown',guard,true);

    modal('THƯ VIỆN NGUỒN TIN',
      '<fieldset><legend>Thêm nguồn tin (không bắt buộc)</legend>'+
      '<div class="news-url-row"><div class="news-url-field">'+
      '<label for="newsSourceUrl">URL nguồn</label>'+
      '<input id="newsSourceUrl" type="url" placeholder="https://..." value="" autocomplete="off">'+
      '</div><button id="newsCheckBtn" class="news-inline-btn" type="button">Kiểm tra</button></div>'+
      '<div class="lookup-state" id="newsCheck">Chưa kiểm tra nguồn.</div></fieldset>'+

      '<fieldset><legend>Nguồn đang có</legend>'+
      '<div class="news-hint">Chọn nguồn tin và số bài báo lấy về mỗi ngày (5-25 bài)</div>'+
      '<div id="newsSources" class="news-sources"><div class="empty">Đang tải danh sách nguồn tin...</div></div>'+
      '<div class="lookup-state" id="newsSummary">Tổng cộng: 0 nguồn · 0 bài</div></fieldset>'+

      '<fieldset><legend>Chế độ bản tin</legend>'+
      '<label><input type="radio" name="newsMode" value="text" checked> Chỉ chữ (tối đa 200 bài)</label>'+
      '<label><input type="radio" name="newsMode" value="images"> Có hình (tối đa 100 bài)</label>'+
      '<div class="news-warning" id="newsModeWarning"></div></fieldset>'+

      '<fieldset><legend>Địa chỉ nhận tin</legend>'+
      '<div class="news-hint">Dán địa chỉ tủ sách của bạn bên dưới và chọn đăng ký, chú ý Google folder phải để chế độ public/everyone can edit.</div>'+
      '<input id="newsShelfUrl" type="url" placeholder="https://drive.google.com/drive/folders/..." autocomplete="off">'+
      '<div class="lookup-state" id="newsShelfStatus">Tủ sách nhận tin</div>'+
      '<div class="modal-actions news-register-actions"><button id="newsRegisterBtn" disabled type="button">Đăng ký</button></div>'+
      '</fieldset>');

    var newsWorkerUrl='https://tangthu-news-worker.mienluonngon.workers.dev';
    var configUrl=newsWorkerUrl+'/news/config';
    var registry=[],subscriptions=[],branchesList=[];

    function canonicalize(value){
      try{
        var u=new URL(String(value||'').trim());
        if(u.protocol!=='http:'&&u.protocol!=='https:')return '';
        u.hash='';
        if(u.pathname.length>1)u.pathname=u.pathname.replace(/\/+$/,'');
        return u.toString();
      }catch(e){return '';}
    }

    function repairMojibake(value){
      var text=String(value||'');
      if(!/[ÃÂ]/.test(text))return text;
      try{
        var bytes=Uint8Array.from(text,function(ch){return ch.charCodeAt(0)&255;});
        return new TextDecoder('utf-8',{fatal:true}).decode(bytes);
      }catch(e){return text;}
    }

    function displaySourceName(value){
      return repairMojibake(value).replace(/\s+/g,' ').trim();
    }

    function workerPost(path,body){
      return fetch(newsWorkerUrl+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
        .then(function(r){
          return r.json().catch(function(){return {};}).then(function(d){
            if(!r.ok||d.ok===false)throw new Error(d.error||('HTTP '+r.status));
            return d;
          });
        });
    }

    function loadJSON(url){
      return fetch(url,{cache:'no-store'}).then(function(r){
        if(!r.ok)throw new Error('HTTP '+r.status);
        return r.json();
      });
    }

    function selectedSources(){
      return draft.sources.filter(function(s){
        return draft.selected[s.id]&&draft.selected[s.id].checked;
      }).map(function(s){
        var n=Number(draft.selected[s.id].count);
        if(!Number.isFinite(n))n=5;
        n=Math.max(5,Math.min(25,Math.round(n)));
        return {id:s.id,count:n};
      });
    }

    function selectedTotal(){
      return selectedSources().reduce(function(total,item){return total+item.count;},0);
    }

    function updateRegisterState(){
      var btn=$('newsRegisterBtn');
      if(!btn)return;
      var hasExisting=draft.branch&&subscriptions.some(function(x){return x.branch_id===draft.branch.id&&x.enabled!==false;});
      btn.disabled=!(draft.branch&&(selectedSources().length||hasExisting));
      btn.textContent=hasExisting?'Cập nhật đăng ký':'Đăng ký';
    }

    function enforceMode(){
      var total=selectedTotal();
      var img=document.querySelector('input[name="newsMode"][value="images"]');
      var txt=document.querySelector('input[name="newsMode"][value="text"]');
      var warning=$('newsModeWarning');
      if(!img||!txt||!warning)return;
      if(total>200){
        draft.mode='text';
        txt.checked=true;
        img.checked=false;
        warning.textContent='Tổng số bài tối đa là 200. Vui lòng giảm số bài.';
      }else if(draft.mode==='images'&&total>100){
        draft.mode='text';
        txt.checked=true;
        img.checked=false;
        warning.textContent='Có hình tối đa 100 bài. Đã tự chuyển về “Chỉ chữ”; nếu muốn dùng hình, vui lòng giảm tổng số bài xuống 100 hoặc ít hơn.';
      }else{
        warning.textContent='';
      }
    }

    function updateSummary(){
      var summary=$('newsSummary');
      if(summary)summary.textContent='Tổng cộng: '+selectedSources().length+' nguồn · '+selectedTotal()+' bài';
      enforceMode();
      updateRegisterState();
    }

    function branchFromUrl(value){
      var raw=String(value||'').trim(),id='';
      try{
        var u=new URL(raw),m=u.pathname.match(/\/folders\/([a-zA-Z0-9_-]+)/);
        id=m?m[1]:(u.searchParams.get('id')||'');
      }catch(e){}
      if(!id){
        var m=raw.match(/^[a-zA-Z0-9_-]{10,}$/);
        if(m)id=m[0];
      }
      return id?(branchesList.find(function(b){return b.enabled!==false&&b.root_folder_id===id;})||null):null;
    }

    function syncSelectionForBranch(){
      draft.sources.forEach(function(s){
        if(draft.touched[s.id])return;
        var sub=draft.branch?subscriptions.find(function(x){
          return x.branch_id===draft.branch.id&&x.source_id===s.id&&x.enabled!==false;
        }):null;
        draft.selected[s.id]={checked:!!sub,count:sub?(Number(sub.article_count)||5):5};
      });
    }

    function renderSources(){
      var host=$('newsSources');
      if(!host)return;
      var active=draft.sources.filter(function(s){return s.enabled!==false;});
      if(!active.length){
        host.innerHTML='<div class="empty">Chưa có nguồn tin.</div>';
        updateSummary();
        return;
      }

      host.innerHTML=active.map(function(s){
        var sel=draft.selected[s.id]||{checked:false,count:5};
        var name=displaySourceName(s.name||s.url);
        var fullName=repairMojibake(s.name||s.url);
        var count=Math.max(5,Math.min(25,Number(sel.count)||5));
        return '<div class="news-source-row">'+
          '<label class="news-source-main">'+
          '<input class="news-source-check" type="checkbox" data-id="'+esc(s.id)+'" '+(sel.checked?'checked':'')+'>'+
          '<span title="'+esc(fullName)+'"><a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(name)+'</a></span>'+
          '</label>'+
          '<input class="news-count" data-id="'+esc(s.id)+'" type="number" min="5" max="25" value="'+count+'" '+(sel.checked?'':'disabled')+'>'+
          '</div>';
      }).join('');

      host.querySelectorAll('.news-source-check').forEach(function(box){
        box.addEventListener('change',function(e){
          e.stopPropagation();
          var id=box.dataset.id;
          var input=host.querySelector('.news-count[data-id="'+id+'"]');
          if(!draft.selected[id])draft.selected[id]={checked:false,count:5};
          draft.selected[id].checked=box.checked;
          draft.touched[id]=true;
          if(input)input.disabled=!box.checked;
          if(draft.branch)$('newsShelfStatus').textContent='Tủ sách: '+(draft.branch.display_name||draft.branch.id);
          else $('newsShelfStatus').textContent='Tủ sách nhận tin';
          updateSummary();
        });
      });

      host.querySelectorAll('.news-count').forEach(function(input){
        input.addEventListener('input',function(e){
          e.stopPropagation();
          var id=input.dataset.id,n=Number(input.value);
          if(!draft.selected[id])draft.selected[id]={checked:false,count:5};
          if(Number.isFinite(n))draft.selected[id].count=Math.max(5,Math.min(25,Math.round(n)));
          draft.touched[id]=true;
          updateSummary();
        });
      });

      updateSummary();
    }

    function resetSourceForm(){
      $('newsSourceUrl').value='';
      $('newsCheck').textContent='Chưa kiểm tra nguồn.';
      $('newsCheckBtn').textContent='Kiểm tra';
      $('newsCheckBtn').disabled=false;
      $('newsCheckBtn').onclick=checkSource;
    }

    function addDraftSource(source){
      var canonical=canonicalize(source.url);
      var existing=draft.sources.find(function(s){return s.id===source.id||canonicalize(s.url)===canonical;});
      if(existing)return existing;
      var copy=JSON.parse(JSON.stringify(source));
      copy.url=canonical||copy.url;
      copy.name=copy.url;
      copy.enabled=true;
      draft.sources.push(copy);
      if(!draft.selected[copy.id])draft.selected[copy.id]={checked:false,count:5};
      return copy;
    }

    function checkSource(){
      var canonical=canonicalize($('newsSourceUrl').value);
      if(!canonical){
        $('newsCheck').textContent='URL không hợp lệ.';
        return;
      }
      $('newsCheckBtn').disabled=true;
      $('newsCheck').textContent='Đang kiểm tra nguồn...';

      workerPost('/source/check',{url:canonical}).then(function(result){
        var source=result.source||{};
        if(!source.id||!source.url)throw new Error('Worker trả về thông tin nguồn không hợp lệ');
        source.url=canonicalize(source.url)||canonical;
        source.name=source.url;
        var existing=draft.sources.find(function(s){return s.id===source.id||canonicalize(s.url)===source.url;});
        if(existing){
          $('newsCheck').textContent='Nguồn này đã có trong thư viện.';
          $('newsCheckBtn').textContent='Đã có';
          $('newsCheckBtn').disabled=true;
          return;
        }
        $('newsCheck').textContent='Nguồn hợp lệ: '+displaySourceName(source.url);
        $('newsCheckBtn').textContent='Thêm nguồn';
        $('newsCheckBtn').disabled=false;
        $('newsCheckBtn').onclick=function(){
          $('newsCheckBtn').disabled=true;
          $('newsCheck').textContent='Đang thêm nguồn...';
          workerPost('/source/add',{url:source.url}).then(function(result){
            var added=result.source||source;
            added.url=canonicalize(added.url)||source.url;
            added.name=added.url;
            addDraftSource(added);
            $('newsCheck').textContent='Đã thêm nguồn: '+displaySourceName(added.url);
            renderSources();
            resetSourceForm();
          }).catch(function(err){
            $('newsCheck').textContent='Không thể thêm nguồn: '+err.message;
            $('newsCheckBtn').textContent='Thêm nguồn';
            $('newsCheckBtn').disabled=false;
          });
        };
      }).catch(function(err){
        $('newsCheck').textContent='Không thể kiểm tra nguồn: '+err.message;
        $('newsCheckBtn').textContent='Kiểm tra';
        $('newsCheckBtn').disabled=false;
        $('newsCheckBtn').onclick=checkSource;
      });
    }

    $('newsSourceUrl').addEventListener('input',function(e){
      e.stopPropagation();
      $('newsCheck').textContent='Chưa kiểm tra nguồn.';
      $('newsCheckBtn').textContent='Kiểm tra';
      $('newsCheckBtn').disabled=false;
      $('newsCheckBtn').onclick=checkSource;
    });

    $('newsSourceUrl').addEventListener('keydown',function(e){e.stopPropagation();});
    $('newsCheckBtn').onclick=checkSource;

    $('newsShelfUrl').addEventListener('input',function(e){
      e.stopPropagation();
      draft.branch=null;
      $('newsShelfStatus').textContent='Tủ sách nhận tin';
      $('newsRegisterBtn').disabled=true;
      clearTimeout(window.__tangthuNewsShelfTimer);
      window.__tangthuNewsShelfTimer=setTimeout(checkShelf,300);
    });

    $('newsShelfUrl').addEventListener('keydown',function(e){e.stopPropagation();});

    document.querySelectorAll('input[name="newsMode"]').forEach(function(radio){
      radio.addEventListener('change',function(e){
        e.stopPropagation();
        draft.mode=this.value;
        $('newsShelfStatus').textContent=draft.branch?'Tủ sách: '+(draft.branch.display_name||draft.branch.id):'Tủ sách nhận tin';
        updateSummary();
      });
    });

    function checkShelf(){
      var raw=$('newsShelfUrl').value.trim();
      if(!raw){
        draft.branch=null;
        $('newsShelfStatus').textContent='Tủ sách nhận tin';
        updateRegisterState();
        return;
      }

      var branch=branchFromUrl(raw);
      if(!branch){
        draft.branch=null;
        $('newsShelfStatus').textContent='tủ sách không tồn tại, vui lòng tạo tủ';
        updateRegisterState();
        return;
      }

      draft.branch=branch;
      syncSelectionForBranch();
      $('newsShelfStatus').textContent='Tủ sách: '+(branch.display_name||branch.id);
      renderSources();
    }

    $('newsRegisterBtn').onclick=function(e){
      e.preventDefault();
      e.stopPropagation();

      var branch=draft.branch;
      var selected=selectedSources();
      var total=selectedTotal();
      var mode=draft.mode;

      if(!branch)return;
      if(total>200){enforceMode();return;}
      if(mode==='images'&&total>100){enforceMode();return;}

      var btn=$('newsRegisterBtn');
      btn.disabled=true;
      $('newsShelfStatus').textContent='Đang đăng ký nhận tin...';

      var newSources=draft.sources.filter(function(s){return draft.pending[s.id];}).map(function(s){
        return {id:s.id,name:s.name,url:s.url,enabled:true};
      });

      workerPost('/news/register',{
        branch_id:branch.id,
        edition_mode:mode,
        total_articles:total,
        new_sources:newSources,
        subscriptions:selected.map(function(x){
          return {source_id:x.id,article_count:x.count};
        })
      }).then(function(result){
        var anySelected=selected.length>0;
        $('newsShelfStatus').textContent=anySelected?((result.branch_name||branch.display_name||branch.id)+' đăng ký nhận tin thành công'):((result.branch_name||branch.display_name||branch.id)+' đã hủy nhận tin');
        btn.disabled=true;
        draft.pending={};
        loadJSON(configUrl).then(function(cfg){subscriptions=Array.isArray(cfg.subscriptions)?cfg.subscriptions:subscriptions;syncSelectionForBranch();renderSources();});
      }).catch(function(err){
        $('newsShelfStatus').textContent='Không thể đăng ký nhận tin: '+err.message;
        btn.disabled=false;
      });
    };

    loadJSON(configUrl).then(function(cfg){
      registry=Array.isArray(cfg.sources)?cfg.sources.map(function(s){
        s.name=s.url||repairMojibake(s.name);
        return s;
      }):[];
      subscriptions=Array.isArray(cfg.subscriptions)?cfg.subscriptions:[];
      branchesList=Array.isArray(cfg.branches)?cfg.branches:[];
      draft.sources=registry.slice();
      syncSelectionForBranch();
      renderSources();
      updateRegisterState();
    }).catch(function(err){
      $('newsSources').innerHTML='<div class="empty">Không tải được Bulletin Registry: '+esc(String(err))+'</div>';
      updateRegisterState();
    });
  }

  function showShelf(){
    var apiUrl='https://script.google.com/macros/s/AKfycbxkXzEVMXy2p6S0C6fMJKoLKDS_arBT0aRaq2x9X6w24L3Ea5RjmKPmxiOYhMUdMe_y5g/exec';
    var state={mode:'none',found:null,checkedId:'',folderName:'',check:null};

    modal('ĐĂNG KÝ / ĐỔI TÊN TỦ SÁCH',
      '<fieldset><legend>Google Drive</legend>'+
      '<label for="driveLink">Đường link thư mục</label>'+
      '<input id="driveLink" type="url" placeholder="https://drive.google.com/drive/folders/..." value="">'+
      '<div class="lookup-state" id="folderInfo">Chưa kiểm tra link.</div>'+
      '</fieldset>'+
      '<fieldset><legend>Tên hiển thị</legend>'+
      '<label for="shelfName">Tên tủ sách</label>'+
      '<input id="shelfName" type="text" placeholder="Tên muốn hiển thị trên Tàng Thư" value="">'+
      '</fieldset>'+
      '<div class="note">Tên <strong>Folder Google Drive</strong> là tên thật của thư mục trên Drive. Tên <strong>Tủ sách</strong> là tên hiển thị trong Tàng Thư và có thể đặt khác.</div>'+
      '<div class="lookup-state" id="shelfMsg">Chưa kiểm tra link.</div>'+
      '<div class="modal-actions"><button id="lookupBtn">Kiểm tra link</button><button id="shareBtn" disabled>Kiểm tra link trước</button></div>');

    var setMessage=function(s){$('shelfMsg').textContent=s};
    var setFolder=function(s){$('folderInfo').textContent=s};

    var updateAction=function(){
      var name=$('shelfName').value.trim();
      var isDelete=!!state.found && name.toUpperCase()==='DELETE';
      var btn=$('shareBtn');
      var blocked=state.check && state.check.can_mutate===false;

      if(state.mode==='create'){
        btn.textContent='Tạo tủ';
        btn.disabled=!state.checkedId || !name;
      }else if(state.mode==='rename'){
        if(isDelete){
          btn.textContent='Xóa tủ';
          btn.disabled=!state.checkedId || blocked;
        }else{
          btn.textContent='Đổi tên';
          btn.disabled=!state.checkedId || !name || blocked;
        }
      }else if(state.mode==='delete'){
        btn.textContent='Xóa tủ';
        btn.disabled=!state.checkedId || blocked;
      }else{
        btn.textContent='Kiểm tra link trước';
        btn.disabled=true;
      }
    };

    var localLookup=function(id){
      return branches().find(function(x){
        return String(x.root_folder_id)===String(id);
      }) || null;
    };

    $('lookupBtn').onclick=function(){
      var link=$('driveLink').value.trim();
      var id=parseDriveId(link);

      if(!id){
        state={mode:'none',found:null,checkedId:'',folderName:'',check:null};
        setFolder('Không nhận ra Folder ID từ đường link Google Drive này.');
        setMessage('Hãy kiểm tra lại đường link.');
        $('shelfName').value='';
        updateAction();
        return;
      }

      if(!apiUrl){
        var local=localLookup(id);
        state.checkedId=id;
        state.mode=local?'rename':'create';
        state.folderName='';
        state.found=local;
        setFolder(local
          ? 'Folder đã đăng ký trong Tàng Thư.'
          : 'Apps Script chưa được cấu hình.');
        $('shelfName').value=local?local.name:'';
        setMessage(local
          ? 'Đã nhận ra tủ hiện tại. Đổi tên hoặc nhập DELETE để xóa.'
          : 'Link hợp lệ về cú pháp nhưng cần Apps Script để kiểm tra folder thật.');
        updateAction();
        return;
      }

      setFolder('Đang kiểm tra Google Drive...');
      setMessage('Đang kiểm tra link...');
      $('lookupBtn').disabled=true;

      var url=apiUrl+'?action=check&drive='+encodeURIComponent(link);

      fetch(url,{method:'GET',redirect:'follow'})
        .then(function(r){
          if(!r.ok) throw new Error('HTTP '+r.status);
          return r.json();
        })
        .then(function(data){
          if(!data.ok){
            state={mode:'none',found:null,checkedId:'',folderName:'',check:data};
            setFolder(data.error||'Không thể kiểm tra folder.');
            setMessage('Link chưa sẵn sàng để đăng ký.');
            $('shelfName').value='';
            updateAction();
            return;
          }

          var found=localLookup(data.folder_id);
          state.checkedId=data.folder_id;
          state.folderName=data.folder_name||'';
          state.found=found;

          if(found){
            state.mode='rename';
            $('shelfName').value=found.name;
            setFolder('Folder Google Drive: '+(data.folder_name||'—'));
            setMessage('Đã nhận ra tủ "'+found.name+'". Đổi tên hoặc nhập DELETE để xóa.');
          }else{
            state.mode='create';
            $('shelfName').value='';
            setFolder('Folder Google Drive: '+(data.folder_name||'—'));
            setMessage('Folder chưa đăng ký. Nhập tên tủ rồi bấm Tạo tủ.');
          }

          updateAction();
        })
        .catch(function(err){
          state={mode:'none',found:null,checkedId:'',folderName:'',check:null};
          setFolder('Không gọi được Apps Script.');
          setMessage(String(err));
          updateAction();
        })
        .finally(function(){
          $('lookupBtn').disabled=false;
        });
    };

    $('shelfName').oninput=updateAction;

    $('driveLink').oninput=function(){
      state={mode:'none',found:null,checkedId:'',folderName:'',check:null};
      setFolder('Đã thay đổi link. Bấm Kiểm tra link.');
      setMessage('Chưa kiểm tra link.');
      updateAction();
    };

    $('shareBtn').onclick=function(){
      var link=$('driveLink').value.trim();
      var id=parseDriveId(link);
      var name=$('shelfName').value.trim();

      if(!apiUrl || !id || id!==state.checkedId)return;

      var isDelete=!!state.found && name.toUpperCase()==='DELETE';
      var action=isDelete?'delete':state.mode;

      if(action==='create' && !name)return;
      if(action==='rename' && !name)return;
      if(action==='delete' && !isDelete)return;
      if(state.check && state.check.can_mutate===false){
        setMessage('Tủ này đang trong thời gian chờ 24 giờ.');
        updateAction();
        return;
      }

      if(action==='delete'){
        if(!window.confirm('Xóa tủ "'+(state.found ? state.found.name : '')+'" khỏi Tàng Thư?'))return;
      }

      var btn=$('shareBtn');
      var lookup=$('lookupBtn');
      btn.disabled=true;
      lookup.disabled=true;
      setMessage(action==='create'
        ? 'Đang tạo tủ...'
        : action==='rename'
          ? 'Đang đổi tên tủ...'
          : 'Đang xóa tủ...');

      fetch(apiUrl,{
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({
          action:action,
          drive_url:link,
          display_name:action==='delete' ? 'DELETE' : name
        })
      })
        .then(function(r){
          return r.text().then(function(t){
            var data={};
            try{data=JSON.parse(t||'{}')}catch(e){throw new Error('Apps Script trả về dữ liệu không hợp lệ: '+t)}
            if(!r.ok) throw new Error('HTTP '+r.status);
            return data;
          });
        })
        .then(function(data){
          if(!data.ok){
            setMessage(data.error||'Không thể thực hiện thao tác.');
            if(data.next_mutation_at){
              setMessage((data.error||'Không thể thực hiện thao tác.')+
                ' Có thể thử lại sau '+data.next_mutation_at+'.');
            }
            return;
          }

          var updateNotice='Nội dung cập nhật tủ sách sẽ xuất hiện sau khoảng 3 đến 5 phút, bạn vui lòng đợi sau đó tải lại trang.';

          setMessage(action==='create'
            ? 'Đã tạo tủ. '+updateNotice
            : action==='rename'
              ? 'Đã đổi tên tủ. '+updateNotice
              : 'Đã xóa tủ. '+updateNotice);

          setTimeout(function(){
            closeModal();
            location.reload();
          },1800);
        })
        .catch(function(err){
          setMessage('Lỗi: '+String(err));
        })
        .finally(function(){
          lookup.disabled=false;
          updateAction();
        });
    };
  }

  function showStory(){
    var state={branch:null,story:null,storyUrl:'',registered:false};
    var apiBase='https://tangthu-story-worker.mienluonngon.workers.dev';
    var sourcesUrl='https://tangthu-story-worker.mienluonngon.workers.dev/story/sources';

    modal('ĐĂNG KÝ ĐỌC ONLINE',
      '<div class="story-main">'+
        '<div class="story-info-panel">'+
          '<div id="storyInfo" class="story-info">'+
            '<div class="story-empty">Chưa đăng ký nội dung đọc.<br><span>Dán địa chỉ tủ nhận sách bên dưới để bắt đầu.</span></div>'+ 
          '</div>'+ 
          '<div class="story-nav">'+
            '<button id="storyPrevBtn" disabled>&lt; Chương trước</button>'+ 
            '<button id="storyNextBtn" disabled>Chương tiếp &gt;</button>'+ 
            '<button id="storyJumpBtn" disabled>Đi đến</button>'+ 
            '<button id="storySourcesBtn">Nguồn sách ...</button>'+ 
          '</div>'+ 
        '</div>'+ 
        '<div class="story-inputs">'+
          '<fieldset><legend>Địa chỉ truyện online</legend>'+ 
            '<input id="storyUrl" type="url" placeholder="https://..." disabled>'+ 
            '<button id="storyRegisterBtn" disabled>Đăng ký</button>'+ 
          '</fieldset>'+ 
          '<fieldset><legend>Địa chỉ nhận sách (Google Drive)</legend>'+ 
            '<input id="storyShelfUrl" type="url" placeholder="https://drive.google.com/drive/folders/...">'+ 
          '</fieldset>'+ 
        '</div>'+ 
      '</div>');

    var branchesUrl='https://raw.githubusercontent.com/Zenkjt/tangthu-opds/main/config/branches.json';
    var branchesList=[];

    function loadJSON(url){
      return fetch(url,{cache:'no-store'}).then(function(r){
        if(!r.ok)throw new Error('HTTP '+r.status);
        return r.json();
      });
    }

    function branchFromUrl(value){
      var raw=String(value||'').trim(),id='';
      try{
        var u=new URL(raw),m=u.pathname.match(/\/folders\/([a-zA-Z0-9_-]+)/);
        id=m?m[1]:(u.searchParams.get('id')||'');
      }catch(e){}
      if(!id){
        var m2=raw.match(/^[a-zA-Z0-9_-]{10,}$/);
        if(m2)id=m2[0];
      }
      return id?(branchesList.find(function(b){
        return b.enabled!==false&&String(b.root_folder_id)===String(id);
      })||null):null;
    }

    function safeText(v){return esc(v==null?'':String(v));}

    function renderInfo(message){
      var h=$('storyInfo');
      if(!state.registered||!state.story){
        h.innerHTML='<div class="story-empty">Chưa đăng ký nội dung đọc.<br><span>'+
          safeText(message||'Dán địa chỉ tủ nhận sách bên dưới để bắt đầu.')+'</span></div>';
        return;
      }
      var s=state.story;
      var current=s.current_toc_index!=null?s.current_toc_index:
        (s.current_chapter!=null?s.current_chapter:
        (s.target_chapter_number!=null?s.target_chapter_number:'—'));
      var currentEntry=(s.chapters||[]).find(function(c){
        return Number(c.toc_index)===Number(current);
      });
      var chapterTitle=currentEntry&&currentEntry.title
        ?currentEntry.title
        :(s.current_chapter_title||s.target_chapter_title||'');
      var total=s.total_chapters!=null?s.total_chapters:
        (s.chapters?s.chapters.length:'—');
      '';
      var cover=s.cover_url||s.cover||'';
      var messageText=message||s.message||'Đang đọc';
      h.innerHTML=
        '<div class="story-info-body">'+
          '<div class="story-cover">'+(cover?'<img src="'+safeText(cover)+'" alt="">':'<div class="story-cover-empty">TRUYỆN</div>')+'</div>'+ 
          '<div class="story-details">'+
            '<h2>'+safeText(s.title||'Không có tên')+'</h2>'+ 
            '<div class="story-row"><span>Tải lên bởi:</span><b>'+safeText(s.author||'—')+'</b></div>'+ 
            '<div class="story-row"><span>Nguồn:</span><b>'+safeText(s.site||s.source||'—')+'</b></div>'+ 
            '<div class="story-row"><span>Tổng chương:</span><b>'+safeText(total)+'</b></div>'+ 
            '<div class="story-row"><span>Đang đọc:</span><b>'+safeText(current)+(chapterTitle?' - '+safeText(chapterTitle):'')+'</b></div>'+ 
            '<div class="story-row"><span>Trạng thái:</span><b>'+safeText(s.status||'Đang đọc')+'</b></div>'+ 
            '<div class="story-row"><span>Tủ nhận sách:</span><b>'+safeText(state.branch?(state.branch.display_name||state.branch.name||state.branch.id):'—')+'</b></div>'+ 
          '</div>'+ 
          '<div class="story-message">'+safeText(messageText)+'</div>'+ 
        '</div>';
    }

    function update(){
      var ok=!!state.branch;
      $('storyUrl').disabled=!ok;
      $('storyRegisterBtn').disabled=!(ok&&$('storyUrl').value.trim());
      var nav=!!(state.registered&&state.story);
      $('storyPrevBtn').disabled=!nav;
      $('storyNextBtn').disabled=!nav;
      $('storyJumpBtn').disabled=!nav;
    }

    function call(action,payload){
      if(!apiBase)return Promise.reject(new Error('Story backend chưa được cấu hình (TANGTHU_STORY_API_URL).'));
      return fetch(apiBase.replace(/\/+$/,'')+'/story/'+action,{
        method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload||{})
      }).then(function(r){
        return r.text().then(function(t){
          var d={};
          try{d=JSON.parse(t||'{}');}catch(e){throw new Error('Backend trả về dữ liệu không hợp lệ.');}
          if(!r.ok||d.ok===false)throw new Error(d.error||('HTTP '+r.status));
          return d;
        });
      });
    }

    function pollOperation(requestId,onDone){
      var tries=0,maxTries=60;
      function once(){
        tries++;
        fetch(apiBase.replace(/\/+$/,'')+'/story/operation?request_id='+encodeURIComponent(requestId),{cache:'no-store'})
          .then(function(r){
            return r.text().then(function(t){
              var d={};
              try{d=JSON.parse(t||'{}');}catch(e){throw new Error('Backend trả về dữ liệu không hợp lệ.');}
              if(!r.ok||d.ok===false)throw new Error(d.error||('HTTP '+r.status));
              return d.operation||{};
            });
          })
          .then(function(op){
            var status=String(op.status||'queued');
            renderInfo(op.message||'Đang xử lý...');
            if(status==='completed'){ onDone(op); return; }
            if(status==='failed')throw new Error(op.message||'Xử lý thất bại.');
            if(tries>=maxTries)throw new Error('Tác vụ vẫn đang xử lý. Hãy chờ rồi mở lại cửa sổ.');
            setTimeout(once,2000);
          })
          .catch(function(e){renderInfo('Lỗi: '+e.message);update();});
      }
      once();
    }

    function register(){
      var url=$('storyUrl').value.trim();
      if(!state.branch||!url)return;
      $('storyRegisterBtn').disabled=true;
      renderInfo('Đang xếp hàng đăng ký truyện...');
      call('register',{user_id:state.branch.id,folder_id:state.branch.root_folder_id,url:url}).then(function(r){
        state.storyUrl=url;
        renderInfo('Đã xếp hàng. Đang scrape danh mục chương...');
        pollOperation(r.request_id,function(op){
          state.story=op.story||null;
          state.registered=!!state.story;
          renderInfo(op.message||'Đăng ký truyện thành công.');
          update();
        });
      }).catch(function(e){
        state.registered=false; state.story=null;
        renderInfo('Không thể đăng ký: '+e.message);
        update();
      });
    }

    function trigger(action,extra){
      if(!state.registered||!state.story)return;
      renderInfo('Đang xếp hàng xử lý...');
      var p={user_id:state.branch.id,folder_id:state.branch.root_folder_id,story_id:state.story.story_id||state.story.id};
      Object.assign(p,extra||{});
      call(action,p).then(function(r){
        pollOperation(r.request_id,function(op){
          state.story=op.story||state.story;
          renderInfo(op.message||'Đã cập nhật.');
          update();
        });
      }).catch(function(e){renderInfo('Lỗi: '+e.message);update();});
    }

    function openSources(){
      var old=$('storySourcesPopup'); if(old)old.remove();
      var popup=document.createElement('div');
      popup.id='storySourcesPopup'; popup.className='story-source-popup';
      popup.innerHTML='<div class="story-source-head"><strong>Nguồn sách</strong><button id="storySourcesClose">X</button></div>'+ 
        '<div id="storySourcesList" class="story-source-list">Đang tải danh sách nguồn...</div>'+ 
        '<div class="story-source-foot"><button id="storySourcesRefresh">↻ Kiểm tra lại nguồn</button><span id="storySourcesUpdated"></span></div>';
      document.body.appendChild(popup);
      $('storySourcesClose').onclick=function(){popup.remove();};
      $('storySourcesRefresh').onclick=function(){loadSources(true);};
      loadSources(false);

      function loadSources(force){
        var list=$('storySourcesList'); list.textContent='Đang kiểm tra nguồn...';
        fetch(sourcesUrl+(sourcesUrl.indexOf('?')>=0?'&':'?')+'t='+(force?Date.now():'1'),{cache:'no-store'})
          .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
          .then(function(data){
            var items=Array.isArray(data)?data:(data.sources||[]);
            if(!items.length){list.textContent='Chưa có dữ liệu nguồn sách.';return;}
            list.innerHTML=items.map(function(x){
              var ok=x.ok!==false&&x.status!=='fail'&&x.status!=='failed';
              return '<div class="story-source-row"><span class="story-source-dot '+(ok?'ok':'fail')+'"></span>'+ 
                '<span class="story-source-domain">'+safeText(x.domain||x.name||'—')+'</span>'+ 
                '<span class="story-source-status">'+safeText(x.message||(ok?'Bình thường':'Không truy cập được'))+'</span></div>';
            }).join('');
            $('storySourcesUpdated').textContent=data.updated_at?'Cập nhật: '+data.updated_at:'';
          })

<script>
(function(){
  function installNewsModalUX(){
    var title=document.getElementById('modalTitle');
    var body=document.getElementById('modalBody');
    var close=document.getElementById('modalClose');
    if(!title||!body)return;

    function isNews(){
      return (title.textContent||'').trim()==='THƯ VIỆN NGUỒN TIN';
    }

    function removeHelp(){
      var btn=document.getElementById('newsHelpBtn');
      if(btn)btn.remove();
      var panel=body.querySelector('.news-help-panel');
      if(panel)panel.remove();
    }

    function ensureHelp(){
      if(!isNews()){
        removeHelp();
        return;
      }
      if(document.getElementById('newsHelpBtn'))return;

      var btn=document.createElement('button');
      btn.id='newsHelpBtn';
      btn.type='button';
      btn.title='Hướng dẫn';
      btn.setAttribute('aria-label','Hướng dẫn');
      btn.textContent='?';

      btn.addEventListener('click',function(e){
        e.preventDefault();
        e.stopPropagation();
        var panel=body.querySelector('.news-help-panel');
        if(panel){
          panel.remove();
          return;
        }

        panel=document.createElement('div');
        panel.className='news-help-panel';
        panel.innerHTML=
          '<p><strong>Đăng ký để có bản tin mỗi ngày trong tủ sách của bạn.</strong></p>'+
          '<p>Tin được cập nhật mỗi ngày lúc 7h sáng giờ Hà Nội vào file <code>0neNews.epub</code> trong thư mục chia sẻ (tủ sách) của bạn để sẵn sàng tải về máy đọc sách qua OPDS.</p>'+
          '<p><strong>Chuẩn bị:</strong> thư mục Google chia sẻ của bạn cần được để chế độ public - Anyone with the link can EDIT (để Tàng Thư có thể cập nhật file tin tức).</p>'+
          '<p>Tick chọn nguồn tin bạn muốn + số bài báo lấy từ mỗi nguồn + ảnh hoặc chỉ text.</p>'+
          '<p>Bạn cũng có thể đóng góp thêm nguồn tin bằng cách chép đường dẫn báo/chuyên mục vào ô "thêm nguồn" và bấm kiểm tra/thêm.</p>'+
          '<p>Dán địa chỉ thư mục Google vào ô "Địa chỉ nhận tin" và bấm đăng ký. Sau này muốn điều chỉnh nguồn tin/số bài, bạn quay lại đây, dán địa chỉ tủ sách và thực hiện điều chỉnh.</p>'+
          '<p>Happy reading.<br>Zenkjt</p>';

        body.insertBefore(panel,body.firstChild);
      });

      if(close&&close.parentNode)close.parentNode.insertBefore(btn,close);
      else title.appendChild(btn);
    }

    ensureHelp();
    var observer=new MutationObserver(ensureHelp);
    observer.observe(title,{childList:true,subtree:true,characterData:true});
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',installNewsModalUX);
  }else{
    installNewsModalUX();
  }
})();
</script>


<script id="tangthu-story-help-script">

    '<p>Theo thiết kế sau khi đăng ký thành công, Tàng thư sẽ tải chương truyện đầu tiên về file <code>0neStory.epub</code> và mục lục sách về file <code>0neStoryTOC.epub</code> trong thư mục chia sẻ (tủ sách) của bạn để sẵn sàng tải về máy đọc sách qua OPDS.</p>'+

    '<p>Dán địa chỉ thư mục Google vào ô "Địa chỉ nhận sách", tên tủ sẽ tự động được hiển thị&nbsp; Dán địa chỉ sách vào ô "Địa chỉ truyện online" và bấm đăng ký, truyện đã sẵn sàng trong tủ của bạn.</p>'+
    '<p>Bấm "Chương tiếp", "Đi đến..." hay "Chương trước" Tàng thư sẽ tải chương tương ứng về thay thế vào <code>0neStory.epub</code> trong tủ.</p>'+
    '<p>Tàng thư có thể tạo cho bạn tool plugin dùng trên Crosspoint để điều khiển chuyển chương sách đang đọc cho bạn. bạn tải về, giải nén, chép vào .crosspoint/plugin để sử dụng.</p>'+

    '<p>Happy reading.<br>Zenkjt</p>';

  function isStoryModal(){
    var title=document.getElementById('modalTitle');
    if(!title)return false;
    return (title.textContent||'').trim()==='ĐĂNG KÝ ĐỌC ONLINE';
  }

  function sync(){
    var title=document.getElementById('modalTitle');
    var body=document.getElementById('modalBody');
    var close=document.getElementById('modalClose');
    if(!title||!body||!close)return;

    var btn=document.getElementById(HELP_ID);
    var panel=document.getElementById(PANEL_ID);

      if(btn)btn.remove();
      if(panel)panel.remove();
      return;

      btn=document.createElement('button');
      btn.id=HELP_ID;
      btn.type='button';
      btn.textContent='?';
      btn.title='Hướng dẫn';
      btn.onclick=function(){
        var p=document.getElementById(PANEL_ID);
        if(p)p.hidden=!p.hidden;
      };
      close.parentNode.insertBefore(btn,close);
    }

    if(!panel){
      panel=document.createElement('div');
      panel.id=PANEL_ID;
      panel.className='story-help-panel';
      panel.hidden=true;
      panel.innerHTML=HELP_HTML;
      body.insertBefore(panel,body.firstChild);
    }
  }

  var observer=new MutationObserver(sync);
  function start(){
    sync();
    var title=document.getElementById('modalTitle');
    if(title)observer.observe(title,{childList:true,subtree:true,characterData:true});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>

  var manifests=[
    ['TTnextChap/manifest.json',{
      name:'TTnextChap',version:'1.0.0',
      description:'Tàng Thư — yêu cầu chuyển sang chương tiếp theo.'
    }],
    ['TTprevChap/manifest.json',{
      name:'TTprevChap',version:'1.0.0',
      description:'Tàng Thư — yêu cầu chuyển về chương trước.'
    }]
  ];

  function enc(s){return new TextEncoder().encode(s)}
  function u16(n){return new Uint8Array([n&255,n>>>8&255])}
  function u32(n){return new Uint8Array([n&255,n>>>8&255,n>>>16&255,n>>>24&255])}
  function cat(){
    var parts=[].slice.call(arguments),out=new Uint8Array(parts.reduce(function(n,p){return n+p.length},0)),o=0;
    parts.forEach(function(p){out.set(p,o);o+=p.length});
    return out;
  }
  function crc32(a){
    var c=0xffffffff;
    for(var i=0;i<a.length;i++){
      c^=a[i];
      for(var j=0;j<8;j++)c=(c>>>1)^(0xedb88320&-(c&1));
    }
    return (c^0xffffffff)>>>0;
  }
  function zipEntry(name,text,offset){
    var n=enc(name),d=(typeof text==='string'?enc(text):text),c=crc32(d);
    var local=cat(new Uint8Array([80,75,3,4]),u16(20),u16(0),u16(0),u16(0),u16(0),u32(c),u32(d.length),u32(d.length),u16(n.length),u16(0),n,d);
    var central=cat(new Uint8Array([80,75,1,2]),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(c),u32(d.length),u32(d.length),u16(n.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),n);
    return {local:local,central:central};
  }
  function makeZip(files){
    var offset=0,locals=[],centrals=[];
    files.forEach(function(pair){
      var e=zipEntry(pair[0],pair[1],offset);
      locals.push(e.local);centrals.push(e.central);offset+=e.local.length;
    });
    var central=cat.apply(null,centrals);
    var end=cat(new Uint8Array([80,75,5,6]),u16(0),u16(0),u16(files.length),u16(files.length),u32(central.length),u32(offset),u16(0));
    return cat.apply(null,locals.concat([central,end]));
  }
  function device(title,description,endpoint,shelf){
    return {
      title:title,description:description,
      browse:{
        format:'json',url:WORKER+endpoint,method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({shelf_no:shelf}),items:'items',page_size:1,
        fields:{title:'title',author:'author',id:'id',url:'url',description:'description'}
      }
    };
  }
  function makePlugin(shelf){
    var files=[];
    manifests.forEach(function(pair){files.push([pair[0],JSON.stringify(pair[1],null,2)+'\n'])});
    files.push(['TTnextChap/device.json',JSON.stringify(device('Tàng Thư Story NEXT','Yêu cầu Tàng Thư xử lý chương tiếp theo.','/story/crosspoint-next',shelf),null,2)+'\n']);
    files.push(['TTprevChap/device.json',JSON.stringify(device('Tàng Thư Story PREV','Yêu cầu Tàng Thư xử lý chương trước.','/story/crosspoint-previous',shelf),null,2)+'\n']);
    var guide=[
      'Gói zip này có 2 thư mục: TTnextChap và TTprevChap được thiết kế theo chuẩn plugin của CrossPoint.',
      '- Bạn chép cả 2 thư mục vào .crosspoint/plugins/ trên thẻ nhớ máy đọc sách.',
      '- Để điều khiển trên máy đọc sách, bạn chạy plugin tương ứng. Tàng thư sẽ tải chương tiếp theo / chương trước về thay thế vào 0neStory.epub trên tủ sách của bạn.',
      '- Chuỗi sử dụng hợp lí trên máy đọc sách: đầu tiên bạn vào OPDS tải 0neStory.epub --> tiếp theo vào plugins chạy TTnextChap --> rồi đọc sách. Khi hết chương sẽ luôn có chương tiếp theo để tải về đọc.',
      '',
      'QR code là Shortcut TTcontrol dùng cho iPhone. Bạn scan nó để lấy về máy, đặt lên màn hình chính để có thể điều khiển trực tiếp Tàng thư/Story.',
      'File QR đi kèm: TTcontrol_iCloud_QR.png',
      '',
      '*Lưu ý: có thể plugin lỗi, bạn vào https://tangthu.pages.dev để kiểm tra và điều khiển trực tiếp nhé.',
      'Happy reading...',
      'Zenkjt'
    ].join('\n');
    files.push(['Huong dan su dung.txt',guide+'\n']);
    var qrBytes=Uint8Array.from(atob(TTCONTROL_QR_BASE64),function(c){return c.charCodeAt(0)});
    files.push(['TTcontrol_iCloud_QR.png',qrBytes]);
    var blob=new Blob([makeZip(files)],{type:'application/zip'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='Tàng thư controller plugin4crosspoint - shelf '+shelf+'.zip';
    a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
  }
  function showMaker(){
    var old=document.getElementById('ttCrosspointBackdrop');
    if(old)old.remove();
    var back=document.createElement('div');
    back.id='ttCrosspointBackdrop';
    back.className='tt-crosspoint-backdrop';
    back.innerHTML=
      '<div class="tt-crosspoint-modal" role="dialog" aria-modal="true" aria-labelledby="ttCrosspointTitle">'+
        '<div class="tt-crosspoint-modal-head">'+
          '<h3 id="ttCrosspointTitle">Tạo CrossPoint plugin</h3>'+
          '<button id="ttCrosspointClose" class="tt-crosspoint-close" type="button" aria-label="Đóng" title="Đóng">×</button>'+
        '</div>'+
        '<p>Nhập số tủ. Tool sẽ tạo một ZIP chứa đầy đủ hai plugin <code>TTnextChap</code> và <code>TTprevChap</code>, kèm hướng dẫn sử dụng.</p>'+
        '<label for="ttCrosspointShelf">Số tủ</label>'+
        '<input id="ttCrosspointShelf" type="number" min="1" step="1" placeholder="Ví dụ: 3" autofocus>'+
        '<div class="tt-crosspoint-actions">'+
          '<button id="ttCrosspointMake" type="button">OK — tạo plugin</button>'+
          '<button id="ttCrosspointCancel" type="button">Cancel</button>'+
        '</div>'+
        '<div id="ttCrosspointStatus" class="tt-crosspoint-status"></div>'+
      '</div>';
    document.body.appendChild(back);
    var input=document.getElementById('ttCrosspointShelf');
    var make=document.getElementById('ttCrosspointMake');
    var cancel=document.getElementById('ttCrosspointCancel');
    var closeBtn=document.getElementById('ttCrosspointClose');
    var status=document.getElementById('ttCrosspointStatus');
    function closeModal(){
      document.removeEventListener('keydown',onModalKeydown);
      back.remove();
    }
    function onModalKeydown(e){
      if(e.key==='Escape'){e.preventDefault();closeModal();}
    }
    document.addEventListener('keydown',onModalKeydown);
    closeBtn.onclick=closeModal;
    cancel.onclick=closeModal;
    function submit(){
      var shelf=Number(input.value);
      if(!Number.isInteger(shelf)||shelf<1){
        status.className='tt-crosspoint-status err';
        status.textContent='Số tủ phải là số nguyên >= 1.';
        input.focus();
        return;
      }
      make.disabled=true;
      status.className='tt-crosspoint-status';
      status.textContent='Đang tạo plugin...';
      try{
        makePlugin(shelf);
        status.textContent='Đã tạo plugin cho tủ '+shelf+'.';
        setTimeout(closeModal,350);
      }catch(e){
        make.disabled=false;
        status.className='tt-crosspoint-status err';
        status.textContent='Không thể tạo plugin: '+e.message;
      }
    }
    make.onclick=submit;
    input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();submit()}});
    back.addEventListener('click',function(e){if(e.target===back)closeModal()});
    setTimeout(function(){input.focus()},0);
  }
  function injectButton(){
    var nav=document.querySelector('.story-nav');
    if(!nav||document.getElementById('storyCrosspointBtn'))return;
    var btn=document.createElement('button');
    btn.id='storyCrosspointBtn';
    btn.type='button';
    btn.textContent='Tools điều khiển';
    btn.disabled=false;
    btn.addEventListener('click',showMaker);
    nav.appendChild(btn);
  }
  var observer=new MutationObserver(injectButton);
  function start(){
    injectButton();
    observer.observe(document.body,{childList:true,subtree:true});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
