name: Register TÀNG THƯ news source

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: tangthu-news-registry
  cancel-in-progress: false

jobs:
  register:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[TIN TỨC]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Process news source request
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const crypto = require('crypto');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;
            if (context.eventName === 'workflow_dispatch') return;
            const body = issue.body || '';
            const urlMatch = body.match(/^- URL:\s*(.+)$/mi);
            const actionMatch = body.match(/^- Hành động:\s*(.+)$/mi);
            const requestedURL = urlMatch ? urlMatch[1].trim() : '';
            const requestedAction = actionMatch ? actionMatch[1].trim().toLowerCase() : 'add';
            function close(message){return github.rest.issues.createComment({owner,repo,issue_number:issue.number,body:message}).then(()=>github.rest.issues.update({owner,repo,issue_number:issue.number,state:'closed'}));}
            function normalizeURL(value){try{const u=new URL(value);if(!['http:','https:'].includes(u.protocol))return '';u.hash='';if(u.pathname.length>1)u.pathname=u.pathname.replace(/\/+$/,'');return u.toString();}catch(_){return '';}}
            if(!requestedURL)return close('❌ **TÀNG THƯ:** Yêu cầu thiếu **URL**.');
            const sourceURL=normalizeURL(requestedURL);
            if(!sourceURL)return close('❌ **TÀNG THƯ:** URL nguồn không hợp lệ.');
            const content=await github.rest.repos.getContent({owner,repo,path:'config/config_news_sources.json',ref:'main'});
            const config=JSON.parse(Buffer.from(content.data.content,'base64').toString('utf8'));
            if(!Array.isArray(config.sources))config.sources=[];
            const index=config.sources.findIndex(s=>s.url===sourceURL);
            const existing=index>=0?config.sources[index]:null;
            if(requestedAction==='disable'||requestedAction==='off'){
              if(!existing)return close('❌ **TÀNG THƯ:** Không tìm thấy nguồn tin này.');
              existing.enabled=false;
              await github.rest.repos.createOrUpdateFileContents({owner,repo,path:'config/config_news_sources.json',message:`Disable news source: ${sourceURL}`,content:Buffer.from(JSON.stringify(config,null,2)+'\n').toString('base64'),sha:content.data.sha,branch:'main'});
              return close(`✅ **TÀNG THƯ:** Đã tắt nguồn **${sourceURL}**.`);
            }
            if(requestedAction==='enable'||requestedAction==='on'){
              if(!existing)return close('❌ **TÀNG THƯ:** Không tìm thấy nguồn tin này.');
              existing.enabled=true;
              await github.rest.repos.createOrUpdateFileContents({owner,repo,path:'config/config_news_sources.json',message:`Enable news source: ${sourceURL}`,content:Buffer.from(JSON.stringify(config,null,2)+'\n').toString('base64'),sha:content.data.sha,branch:'main'});
              return close(`✅ **TÀNG THƯ:** Đã bật nguồn **${sourceURL}**.`);
            }
            if(requestedAction==='delete'||requestedAction==='remove'){
              if(!existing)return close('❌ **TÀNG THƯ:** Không tìm thấy nguồn tin này.');
              config.sources.splice(index,1);
              await github.rest.repos.createOrUpdateFileContents({owner,repo,path:'config/config_news_sources.json',message:`Remove news source: ${sourceURL}`,content:Buffer.from(JSON.stringify(config,null,2)+'\n').toString('base64'),sha:content.data.sha,branch:'main'});
              return close(`✅ **TÀNG THƯ:** Đã xóa nguồn **${sourceURL}**.`);
            }
            if(requestedAction==='update'){
              if(!existing)return close('❌ **TÀNG THƯ:** Không tìm thấy nguồn tin này.');
              existing.name=sourceURL;
              await github.rest.repos.createOrUpdateFileContents({owner,repo,path:'config/config_news_sources.json',message:`Update news source: ${sourceURL}`,content:Buffer.from(JSON.stringify(config,null,2)+'\n').toString('base64'),sha:content.data.sha,branch:'main'});
              return close(`✅ **TÀNG THƯ:** Đã cập nhật nguồn **${sourceURL}**.`);
            }
            if(requestedAction!=='add')return close('❌ **TÀNG THƯ:** Hành động phải là add, update, enable, disable, delete hoặc remove.');
            if(existing)return close('ℹ️ **TÀNG THƯ:** Nguồn này đã tồn tại.');
            const sourceId=`s-${crypto.createHash('sha256').update(sourceURL).digest('hex').slice(0,12)}`;
            const maxOrder=config.sources.reduce((max,s)=>Number.isFinite(s.order)?Math.max(max,s.order):max,0);
            config.sources.push({id:sourceId,name:sourceURL,url:sourceURL,enabled:true,order:maxOrder+1});
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path:'config/config_news_sources.json',message:`Register news source: ${sourceURL}`,content:Buffer.from(JSON.stringify(config,null,2)+'\n').toString('base64'),sha:content.data.sha,branch:'main'});
            return close(`✅ **TÀNG THƯ:** Đã đăng ký nguồn **${sourceURL}**.`);
