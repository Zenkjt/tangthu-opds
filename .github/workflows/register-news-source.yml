name: Register TÀNG THƯ news source

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: tangthu-news-registry
  cancel-in-progress: false

jobs:
  register:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[TIN TỨC]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Process news source request
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const crypto = require('crypto');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;
            if (context.eventName === 'workflow_dispatch') { core.info('Manual run: no issue to process.'); return; }
            const title = issue.title || '';
            if (!title.startsWith('[TIN TỨC]')) return;
            const body = issue.body || '';
            const nameMatch = body.match(/^- Tên nguồn:\s*(.+)$/mi);
            const urlMatch = body.match(/^- URL:\s*(.+)$/mi);
            const actionMatch = body.match(/^- Hành động:\s*(.+)$/mi);
            const requestedName = nameMatch ? nameMatch[1].trim() : '';
            const requestedURL = urlMatch ? urlMatch[1].trim() : '';
            const requestedAction = actionMatch ? actionMatch[1].trim().toLowerCase() : 'add';
            function fail(message) {
              return github.rest.issues.createComment({owner,repo,issue_number:issue.number,body:`❌ **TÀNG THƯ:** ${message}`}).then(() => github.rest.issues.update({owner,repo,issue_number:issue.number,state:'closed'}));
            }
            function normalizeURL(value) {
              try {
                const u = new URL(value);
                if (!['http:','https:'].includes(u.protocol)) return '';
                u.hash = '';
                if (u.pathname.length > 1) u.pathname = u.pathname.replace(/\/+$/,'');
                return u.toString();
              } catch (_) { return ''; }
            }
            function sourceName(value) {
              try {
                const host = new URL(value).hostname.toLowerCase().replace(/^www\./,'');
                const first = host.split('.')[0];
                if (!first) return host;
                const acronyms = new Set(['bbc','cnn','npr','abc','nbc','cbs','cnbc','dw','ap','afp','ansa','upi']);
                if (acronyms.has(first)) return first.toUpperCase();
                return first.replace(/[-_]+/g,' ').replace(/\b\w/g,c => c.toUpperCase());
              } catch (_) { return ''; }
            }
            if (!requestedURL) return fail('Yêu cầu thiếu **URL**.');
            const sourceURL = normalizeURL(requestedURL);
            if (!sourceURL) return fail('URL nguồn không hợp lệ.');
            const autoName = requestedName || sourceName(sourceURL);
            if (!autoName) return fail('Không thể tự xác định tên nguồn.');
            const content = await github.rest.repos.getContent({owner,repo,path:'config/config_news_sources.json',ref:'main'});
            if (Array.isArray(content.data)) return fail('Không đọc được config/config_news_sources.json.');
            const config = JSON.parse(Buffer.from(content.data.content,'base64').toString('utf8'));
            if (!Array.isArray(config.sources)) config.sources = [];
            const existingIndex = config.sources.findIndex(source => source.url === sourceURL);
            const existing = existingIndex >= 0 ? config.sources[existingIndex] : null;
            if (requestedAction === 'delete' || requestedAction === 'remove') {
              if (!existing) return fail('Không tìm thấy nguồn tin này. Không có gì để xóa.');
              const deletedName = existing.name;
              config.sources.splice(existingIndex,1);
              await github.rest.repos.createOrUpdateFileContents({owner,repo,path:'config/config_news_sources.json',message:`Remove news source: ${deletedName}`,content:Buffer.from(JSON.stringify(config,null,2)+'\n').toString('base64'),sha:content.data.sha,branch:'main'});
              await github.rest.issues.createComment({owner,repo,issue_number:issue.number,body:`✅ **TÀNG THƯ:** Đã xóa nguồn tin **${deletedName}** khỏi Bulletin Registry.`});
            } else if (existing) {
              existing.name = autoName;
              existing.enabled = true;
              await github.rest.repos.createOrUpdateFileContents({owner,repo,path:'config/config_news_sources.json',message:`Update news source: ${autoName}`,content:Buffer.from(JSON.stringify(config,null,2)+'\n').toString('base64'),sha:content.data.sha,branch:'main'});
              await github.rest.issues.createComment({owner,repo,issue_number:issue.number,body:`✅ **TÀNG THƯ:** Đã cập nhật nguồn tin **${autoName}**.`});
            } else {
              const sourceId = `s-${crypto.createHash('sha256').update(sourceURL).digest('hex').slice(0,12)}`;
              const maxOrder = config.sources.reduce((max,source) => Number.isFinite(source.order) ? Math.max(max,source.order) : max,0);
              config.sources.push({id:sourceId,name:autoName,url:sourceURL,enabled:true,order:maxOrder+1});
              await github.rest.repos.createOrUpdateFileContents({owner,repo,path:'config/config_news_sources.json',message:`Register news source: ${autoName}`,content:Buffer.from(JSON.stringify(config,null,2)+'\n').toString('base64'),sha:content.data.sha,branch:'main'});
              await github.rest.issues.createComment({owner,repo,issue_number:issue.number,body:`✅ **TÀNG THƯ:** Đã đăng ký nguồn tin **${autoName}**.\n\nSource ID: \`${sourceId}\``});
            }
            await github.rest.actions.createWorkflowDispatch({owner,repo,workflow_id:'pages.yml',ref:'main'});
            await github.rest.issues.createComment({owner,repo,issue_number:issue.number,body:'🔄 Đã yêu cầu build lại GitHub Pages để cập nhật Bulletin Registry.'});
            await github.rest.issues.update({owner,repo,issue_number:issue.number,state:'closed'});
