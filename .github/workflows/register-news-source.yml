name: Register TÀNG THƯ news source

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: tangthu-news-registry
  cancel-in-progress: false

jobs:
  register:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[TIN TỨC]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Process news source request
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const crypto = require('crypto');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;

            if (context.eventName === 'workflow_dispatch') return;

            const body = issue.body || '';
            const urlMatches = [...body.matchAll(/^- URL:\s*(.+)$/gmi)];
            const requestedURLs = urlMatches
              .map(m => m[1].trim())
              .filter(Boolean);

            const actionMatch = body.match(/^- Hành động:\s*(.+)$/mi);
            const requestedAction = actionMatch
              ? actionMatch[1].trim().toLowerCase()
              : 'add';

            function close(message) {
              return github.rest.issues.createComment({
                owner, repo, issue_number: issue.number, body: message
              }).then(() => github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed'
              }));
            }

            function normalizeURL(value) {
              try {
                const u = new URL(value);
                if (!['http:', 'https:'].includes(u.protocol)) return '';
                u.hash = '';
                if (u.pathname.length > 1) {
                  u.pathname = u.pathname.replace(/\/+$/, '');
                }
                return u.toString();
              } catch (_) {
                return '';
              }
            }

            if (!requestedURLs.length) {
              return close('❌ **TÀNG THƯ:** Yêu cầu thiếu ít nhất một dòng **URL**.');
            }

            const normalizedURLs = [...new Set(requestedURLs.map(normalizeURL))];
            if (normalizedURLs.some(u => !u)) {
              return close('❌ **TÀNG THƯ:** Có URL không hợp lệ.');
            }

            if (requestedAction === 'delete' || requestedAction === 'remove') {
              const sourceContent = await github.rest.repos.getContent({
                owner, repo,
                path: 'config/config_news_sources.json',
                ref: 'main'
              });

              const subContent = await github.rest.repos.getContent({
                owner, repo,
                path: 'config/config_news_subscriptions.json',
                ref: 'main'
              });

              const sourceConfig = JSON.parse(
                Buffer.from(sourceContent.data.content, 'base64').toString('utf8')
              );
              const subConfig = JSON.parse(
                Buffer.from(subContent.data.content, 'base64').toString('utf8')
              );

              if (!Array.isArray(sourceConfig.sources)) sourceConfig.sources = [];
              if (!Array.isArray(subConfig.subscriptions)) subConfig.subscriptions = [];

              const foundSources = [];
              const missingURLs = [];

              for (const sourceURL of normalizedURLs) {
                const index = sourceConfig.sources.findIndex(s => s.url === sourceURL);
                if (index < 0) {
                  missingURLs.push(sourceURL);
                } else {
                  foundSources.push(sourceConfig.sources[index]);
                }
              }

              if (!foundSources.length) {
                return close(
                  `❌ **TÀNG THƯ:** Không tìm thấy nguồn nào trong ${normalizedURLs.length} URL được yêu cầu.`
                );
              }

              const deletedSourceIds = new Set(foundSources.map(s => s.id));

              sourceConfig.sources = sourceConfig.sources.filter(
                s => !deletedSourceIds.has(s.id)
              );

              const beforeSubs = subConfig.subscriptions.length;
              subConfig.subscriptions = subConfig.subscriptions.filter(
                s => !deletedSourceIds.has(s.source_id)
              );
              const removedSubscriptions =
                beforeSubs - subConfig.subscriptions.length;

              // Atomically commit both registry files in one Git commit.
              const ref = await github.rest.git.getRef({
                owner, repo, ref: 'heads/main'
              });

              const baseCommit = await github.rest.git.getCommit({
                owner, repo, commit_sha: ref.data.object.sha
              });

              const tree = await github.rest.git.createTree({
                owner, repo,
                base_tree: baseCommit.data.tree.sha,
                tree: [
                  {
                    path: 'config/config_news_sources.json',
                    mode: '100644',
                    type: 'blob',
                    content: JSON.stringify(sourceConfig, null, 2) + '\n'
                  },
                  {
                    path: 'config/config_news_subscriptions.json',
                    mode: '100644',
                    type: 'blob',
                    content: JSON.stringify(subConfig, null, 2) + '\n'
                  }
                ]
              });

              const commit = await github.rest.git.createCommit({
                owner, repo,
                message: `Remove ${foundSources.length} news source(s)`,
                tree: tree.data.sha,
                parents: [baseCommit.data.sha]
              });

              await github.rest.git.updateRef({
                owner, repo,
                ref: 'heads/main',
                sha: commit.data.sha
              });

              const lines = [
                `✅ **TÀNG THƯ:** Đã xóa **${foundSources.length} nguồn tin**.`,
                `🗑️ Đã xóa **${removedSubscriptions} đăng ký nhận tin** liên quan.`
              ];

              if (missingURLs.length) {
                lines.push(
                  `ℹ️ Không tìm thấy ${missingURLs.length} URL:`,
                  ...missingURLs.map(u => `- ${u}`)
                );
              }

              lines.push(
                '',
                'Đã cập nhật đồng thời `config_news_sources.json` và `config_news_subscriptions.json` trong một commit.'
              );

              return close(lines.join('\n'));
            }

            // Keep the existing single-source behavior for add/update/enable/disable.
            if (normalizedURLs.length !== 1) {
              return close(
                '❌ **TÀNG THƯ:** Chỉ hành động `delete`/`remove` hỗ trợ nhiều URL trong một Issue.'
              );
            }

            const sourceURL = normalizedURLs[0];

            const sourceContent = await github.rest.repos.getContent({
              owner, repo,
              path: 'config/config_news_sources.json',
              ref: 'main'
            });

            const sourceConfig = JSON.parse(
              Buffer.from(sourceContent.data.content, 'base64').toString('utf8')
            );

            if (!Array.isArray(sourceConfig.sources)) {
              sourceConfig.sources = [];
            }

            const index = sourceConfig.sources.findIndex(s => s.url === sourceURL);
            const existing = index >= 0 ? sourceConfig.sources[index] : null;

            if (requestedAction === 'disable' || requestedAction === 'off') {
              if (!existing) {
                return close('❌ **TÀNG THƯ:** Không tìm thấy nguồn tin này.');
              }

              existing.enabled = false;

              await github.rest.repos.createOrUpdateFileContents({
                owner, repo,
                path: 'config/config_news_sources.json',
                message: `Disable news source: ${sourceURL}`,
                content: Buffer.from(JSON.stringify(sourceConfig, null, 2) + '\n').toString('base64'),
                sha: sourceContent.data.sha,
                branch: 'main'
              });

              return close(`✅ **TÀNG THƯ:** Đã tắt nguồn **${sourceURL}**.`);
            }

            if (requestedAction === 'enable' || requestedAction === 'on') {
              if (!existing) {
                return close('❌ **TÀNG THƯ:** Không tìm thấy nguồn tin này.');
              }

              existing.enabled = true;

              await github.rest.repos.createOrUpdateFileContents({
                owner, repo,
                path: 'config/config_news_sources.json',
                message: `Enable news source: ${sourceURL}`,
                content: Buffer.from(JSON.stringify(sourceConfig, null, 2) + '\n').toString('base64'),
                sha: sourceContent.data.sha,
                branch: 'main'
              });

              return close(`✅ **TÀNG THƯ:** Đã bật nguồn **${sourceURL}**.`);
            }

            if (requestedAction === 'update') {
              if (!existing) {
                return close('❌ **TÀNG THƯ:** Không tìm thấy nguồn tin này.');
              }

              existing.name = sourceURL;

              await github.rest.repos.createOrUpdateFileContents({
                owner, repo,
                path: 'config/config_news_sources.json',
                message: `Update news source: ${sourceURL}`,
                content: Buffer.from(JSON.stringify(sourceConfig, null, 2) + '\n').toString('base64'),
                sha: sourceContent.data.sha,
                branch: 'main'
              });

              return close(`✅ **TÀNG THƯ:** Đã cập nhật nguồn **${sourceURL}**.`);
            }

            if (requestedAction !== 'add') {
              return close(
                '❌ **TÀNG THƯ:** Hành động phải là add, update, enable, disable, delete hoặc remove.'
              );
            }

            if (existing) {
              return close('ℹ️ **TÀNG THƯ:** Nguồn này đã tồn tại.');
            }

            const sourceId = `s-${crypto.createHash('sha256')
              .update(sourceURL)
              .digest('hex')
              .slice(0, 12)}`;

            const maxOrder = sourceConfig.sources.reduce(
              (max, s) => Number.isFinite(s.order) ? Math.max(max, s.order) : max,
              0
            );

            sourceConfig.sources.push({
              id: sourceId,
              name: sourceURL,
              url: sourceURL,
              enabled: true,
              order: maxOrder + 1
            });

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo,
              path: 'config/config_news_sources.json',
              message: `Register news source: ${sourceURL}`,
              content: Buffer.from(JSON.stringify(sourceConfig, null, 2) + '\n').toString('base64'),
              sha: sourceContent.data.sha,
              branch: 'main'
            });

            return close(`✅ **TÀNG THƯ:** Đã đăng ký nguồn **${sourceURL}**.`);
