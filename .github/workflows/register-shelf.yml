name: Register TÀNG THƯ shelf

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: tangthu-register
  cancel-in-progress: false

jobs:
  register:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[TANGTHU]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Process shelf request
        uses: actions/github-script@v8
        env:
          DRIVE_API_KEY: ${{ secrets.TANGTHU_GOOGLE_API_KEY }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const crypto = require('crypto');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;

            if (context.eventName === 'workflow_dispatch') {
              core.info('Manual run: no issue to process.');
              return;
            }

            const title = issue.title || '';
            if (!title.startsWith('[TANGTHU]')) return;

            const body = issue.body || '';
            const driveMatch = body.match(/^- Google Drive:\s*(.+)$/mi);
            const nameMatch = body.match(/^- Tên tủ:\s*(.+)$/mi);
            const driveURL = driveMatch ? driveMatch[1].trim() : '';
            const requestedName = nameMatch ? nameMatch[1].trim() : '';

            function fail(message) {
              return github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `❌ **TÀNG THƯ:** ${message}`
              }).then(() => github.rest.issues.update({
                owner, repo, issue_number: issue.number,
                state: 'closed'
              }));
            }

            function parseDriveId(value) {
              try {
                const u = new URL(value);
                if (u.hostname !== 'drive.google.com') return '';
                const m = u.pathname.match(/^\/drive\/folders\/([A-Za-z0-9_-]+)/);
                if (m) return m[1];
                const id = u.searchParams.get('id');
                return id && /^[A-Za-z0-9_-]+$/.test(id) ? id : '';
              } catch (_) {
                return '';
              }
            }

            if (!driveURL || !requestedName) {
              return fail('Yêu cầu thiếu Google Drive hoặc Tên tủ. Hãy gửi lại từ nút **Tủ sách** trên trang TÀNG THƯ.');
            }

            if (requestedName.length > 80) {
              return fail('Tên tủ quá dài (tối đa 80 ký tự).');
            }

            const folderId = parseDriveId(driveURL);
            if (!folderId) {
              return fail('Link không phải Google Drive folder hợp lệ.');
            }

            if (!process.env.DRIVE_API_KEY) {
              core.setFailed('TANGTHU_GOOGLE_API_KEY is missing');
              return;
            }

            const driveURLAPI = `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(folderId)}?fields=id,name,mimeType,trashed&key=${encodeURIComponent(process.env.DRIVE_API_KEY)}`;
            const driveResponse = await fetch(driveURLAPI);
            if (!driveResponse.ok) {
              return fail('Không thể truy cập thư mục Google Drive. Hãy kiểm tra thư mục đã được chia sẻ để TÀNG THƯ có thể đọc hay chưa.');
            }
            const folder = await driveResponse.json();
            if (folder.mimeType !== 'application/vnd.google-apps.folder' || folder.trashed) {
              return fail('Link này không trỏ tới một thư mục Google Drive đang hoạt động.');
            }

            const content = await github.rest.repos.getContent({
              owner, repo, path: 'config/branches.json', ref: 'main'
            });
            if (Array.isArray(content.data)) {
              return fail('Không đọc được config/branches.json.');
            }

            const configText = Buffer.from(content.data.content, 'base64').toString('utf8');
            const config = JSON.parse(configText);
            if (!Array.isArray(config.branches)) config.branches = [];

            const existing = config.branches.find(b => b.root_folder_id === folderId);
            const branchId = existing?.id || `g-${crypto.createHash('sha256').update(folderId).digest('hex').slice(0, 12)}`;

            if (existing) {
              const oldName = existing.display_name;
              existing.display_name = requestedName;
              existing.enabled = true;

              await github.rest.repos.createOrUpdateFileContents({
                owner, repo,
                path: 'config/branches.json',
                message: `Update TÀNG THƯ shelf name: ${requestedName}`,
                content: Buffer.from(JSON.stringify(config, null, 2) + '\n').toString('base64'),
                sha: content.data.sha,
                branch: 'main'
              });

              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `✅ **TÀNG THƯ:** Đã đổi tên **${oldName}** → **${requestedName}**. Thư mục Google Drive vẫn giữ tên **${folder.name}**. GitHub Actions sẽ tự build lại Web + OPDS.`
              });
            } else {
              config.branches.push({
                id: branchId,
                display_name: requestedName,
                root_folder_id: folderId,
                enabled: true
              });

              await github.rest.repos.createOrUpdateFileContents({
                owner, repo,
                path: 'config/branches.json',
                message: `Register TÀNG THƯ shelf: ${requestedName}`,
                content: Buffer.from(JSON.stringify(config, null, 2) + '\n').toString('base64'),
                sha: content.data.sha,
                branch: 'main'
              });

              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `✅ **TÀNG THƯ:** Đã đăng ký tủ **${requestedName}**. Google Drive: **${folder.name}**. Tủ sẽ xuất hiện trên Web + OPDS sau khi GitHub Actions build xong.`
              });
            }

            await github.rest.issues.update({
              owner, repo, issue_number: issue.number, state: 'closed'
            });
