name: Build TÀNG THƯ Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "cmd/generate/**"
      - "internal/drive/**"
      - "config/branches.json"
      - "scripts/postprocess_ui.py"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Generate static catalog
        env:
          TANGTHU_GOOGLE_API_KEY: ${{ secrets.TANGTHU_GOOGLE_API_KEY }}
          TANGTHU_BRANCH_CONFIG: config/branches.json
          TANGTHU_OUTPUT_DIR: docs
          TANGTHU_BASE_URL: https://zenkjt.github.io/tangthu-opds
        run: go run ./cmd/generate
      - name: Apply catalog UI
        run: python3 scripts/postprocess_ui.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
