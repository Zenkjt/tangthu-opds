name: Build TÀNG THƯ Pages

on:
  workflow_dispatch:
  repository_dispatch:
    types: [drive_changed]
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "cmd/generate/**"
      - "internal/drive/**"
      - "config/branches.json"
      - "scripts/tangthu_lifecycle.py"
      - "scripts/postprocess_ui.py"
      - "scripts/postprocess_bookshelf.py"
      - "scripts/postprocess_registration.py"
      - "scripts/paginate_opds.py"
      - "scripts/rewrite_opds_download_urls.py"
      - "docs/assets/bookshelf/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preserve bookshelf assets
        run: |
          test -d docs/assets/bookshelf
          rm -rf .build-assets
          mkdir -p .build-assets
          cp -a docs/assets/bookshelf .build-assets/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Check shelf lifecycle
        env:
          TANGTHU_GOOGLE_API_KEY: ${{ secrets.TANGTHU_GOOGLE_API_KEY }}
          TANGTHU_BRANCH_CONFIG: config/branches.json
        run: python3 scripts/tangthu_lifecycle.py preflight

      - name: Persist lifecycle state
        run: |
          if git diff --quiet -- config/branches.json; then
            echo "No lifecycle state change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/branches.json
          git commit -m "chore: update shelf lifecycle [skip ci]"
          git push

      - name: Generate static catalog
        env:
          TANGTHU_GOOGLE_API_KEY: ${{ secrets.TANGTHU_GOOGLE_API_KEY }}
          TANGTHU_BRANCH_CONFIG: .build/branches.json
          TANGTHU_OUTPUT_DIR: docs
          TANGTHU_BASE_URL: https://zenkjt.github.io/tangthu-opds
        run: go run ./cmd/generate

      - name: Merge suspended shelves
        run: python3 scripts/tangthu_lifecycle.py merge

      - name: Restore bookshelf assets
        run: |
          mkdir -p docs/assets
          cp -a .build-assets/bookshelf docs/assets/

      - name: Rewrite OPDS download URLs
        env:
          TANGTHU_DOWNLOAD_WORKER_URL: ${{ vars.TANGTHU_DOWNLOAD_WORKER_URL }}
        run: python3 scripts/rewrite_opds_download_urls.py

      - name: Paginate OPDS feeds
        run: python3 scripts/paginate_opds.py

      - name: Apply catalog UI
        run: python3 scripts/postprocess_ui.py

      - name: Apply bookshelf UI
        run: python3 scripts/postprocess_bookshelf.py

      - name: Apply registration UI
        env:
          TANGTHU_APPS_SCRIPT_URL: ${{ vars.TANGTHU_APPS_SCRIPT_URL }}
        run: python3 scripts/postprocess_registration.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
